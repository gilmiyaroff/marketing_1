plugins {
    id 'com.android.application'
}
android {
    namespace 'kz.gilmiyarov.booxduo.uninstaller'
    compileSdk 35
    defaultConfig {
        applicationId 'kz.gilmiyarov.booxduo.uninstaller'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

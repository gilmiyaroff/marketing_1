name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android platform 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep one debug signing identity between routine CI builds.
      # The first install of this key still requires uninstalling the earlier APK.
      # For permanent release signing, migrate this keystore to encrypted repository secrets.
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boox-duo-debug-signing-v1

      - name: Generate debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Prepare Python for SVG rasterization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert transparent monochrome SVG to Android PNG assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG==2.8.2"
          mkdir -p app/src/main/res/drawable-nodpi
          python - <<'PY'
          import cairosvg
          for name in ("ruslan", "anna", "amelia"):
              src = {
                  "ruslan": "artwork/ruslan_space_ink.svg",
                  "anna": "artwork/anna_blossom_ink.svg",
                  "amelia": "artwork/amelia_story_ink.svg",
              }[name]
              out = f"app/src/main/res/drawable-nodpi/art_{name}.png"
              cairosvg.svg2png(url=src, write_to=out, output_width=1000, output_height=480)
              print(out)
          PY

      - name: Unpack family square cover photos
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, pathlib, zipfile
          payload = pathlib.Path("artwork/boox_family_square_covers.zip.b64").read_text().strip()
          folder = pathlib.Path("app/src/main/res/drawable-nodpi")
          folder.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as covers:
              for name in ("ruslan", "anna", "amelia"):
                  filename = "shelf_" + name + ".jpg"
                  (folder / filename).write_bytes(covers.read(filename))
                  print("Prepared " + filename)
          PY

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug :uninstaller:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooxDuo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish optional uninstall helper
        uses: actions/upload-artifact@v4
        with:
          name: BooxDuo-uninstall-helper
          path: uninstaller/build/outputs/apk/debug/uninstaller-debug.apk
          if-no-files-found: error
          retention-days: 30

plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.gilmiyarov.booxduo'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.gilmiyarov.booxduo'
        minSdk 26
        targetSdk 32
        versionCode 10
        versionName '0.10.0'
    }

    // Use exactly the keystore cached by CI, rather than an SDK-dependent
    // default path. This keeps signatures stable between consecutive builds.
    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
